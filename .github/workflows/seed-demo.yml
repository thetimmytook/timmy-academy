name: Seed demo data
run-name: Seed demo data — ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target database
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  seed:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: academy-${{ inputs.environment }}-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -w @timmy/contracts
      - run: npm run typecheck:infrastructure
      - run: npm run test -w @timmy/api -- src/benchmark/demo-seed.test.ts
      - name: Seed selected database
        run: npm run "db:seed:demo:$DEMO_ENVIRONMENT"
        env:
          DEMO_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
