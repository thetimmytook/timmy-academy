name: Audit benchmark submissions
run-name: Read-only benchmark audit — ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target database
        type: choice
        required: true
        default: production
        options: [staging, production]
      owner_run_id:
        description: Public ID of your published run, used to verify your account mapping
        type: string
        required: true
        default: br_d6441fbb-c0af-4db4-9f56-254826da628e

permissions:
  contents: read

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: academy-${{ inputs.environment }}-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @timmy/contracts
      - run: npm run typecheck:infrastructure
      - run: node --test infrastructure/audit-submissions.test.ts
      - name: SELECT-only aggregate report
        run: node infrastructure/audit-submissions.ts
        env:
          AUDIT_ENVIRONMENT: ${{ inputs.environment }}
          AUDIT_OWNER_RUN_ID: ${{ inputs.owner_run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
