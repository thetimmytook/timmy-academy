name: Check and deploy
run-name: Check and promote ${{ github.sha }}

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Keep the staging candidate in place while its production approval is pending.
# New pushes replace the single pending run, never the run awaiting approval.
concurrency:
  group: academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Checks and build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Compile shared contracts once for all checks and both application builds.
      - run: npm run build -w @timmy/contracts
      - run: npm run format:check
      - run: npx eslint .
      - name: Typecheck
        run: |
          npm run typecheck -w @timmy/contracts
          npm run typecheck -w @timmy/api
          npm run typecheck -w @timmy/web
          npm run typecheck:infrastructure
          npx tsc -p tsconfig.json
      - name: Tests
        run: |
          npm run test -w @timmy/contracts
          npm run test -w @timmy/api
          npm run test -w @timmy/web
          npm run test:infrastructure
      - name: Build frontend and Worker once
        run: |
          npm run build -w @timmy/web
          npm run build -w @timmy/api
      - name: Package artifact and checksums
        id: package
        run: |
          node infrastructure/deployment-artifact.ts
          mkdir -p dist
          tar -czf dist/deployment.tar.gz -C .wrangler/deployment .
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: academy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/deployment.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  staging:
    name: Deploy staging
    concurrency:
      group: academy-staging-database
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: .wrangler/download
          merge-multiple: true
      - name: Extract the built artifact
        run: |
          mkdir -p .wrangler/deployment
          tar -xzf .wrangler/download/deployment.tar.gz -C .wrangler/deployment
      - name: Verify artifact, migrate staging and deploy without bundling
        run: npm run deploy:staging
        env:
          DEPLOYMENT_MANIFEST_SHA256: ${{ needs.check.outputs.manifest-sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  production-protection:
    name: Verify production Required reviewers
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node infrastructure/production-approval.ts
        env:
          GH_TOKEN: ${{ github.token }}

  production:
    name: Approve and deploy production
    concurrency:
      group: academy-production-database
      cancel-in-progress: false
    needs: [check, staging, production-protection]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: https://timmy.academy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: .wrangler/download
          merge-multiple: true
      - name: Extract the staging artifact
        run: |
          mkdir -p .wrangler/deployment
          tar -xzf .wrangler/download/deployment.tar.gz -C .wrangler/deployment
      - name: Verify artifact and approval, migrate production and deploy without bundling
        run: npm run deploy:production
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_MANIFEST_SHA256: ${{ needs.check.outputs.manifest-sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
