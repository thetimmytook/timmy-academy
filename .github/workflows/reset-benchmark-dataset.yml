name: Reset benchmark dataset (temporary)
run-name: Reset benchmark dataset — ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target database
        type: choice
        required: true
        default: staging
        options: [staging, production]
      audit_reviewed:
        description: I reviewed the read-only audit and approved deleting all benchmark data
        type: boolean
        required: true
        default: false
      confirmation:
        description: Enter RESET staging or RESET production to confirm the selected target
        type: string
        required: true

permissions:
  contents: read

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'
  RESET_ENVIRONMENT: ${{ inputs.environment }}
  RESET_AUDIT_REVIEWED: ${{ inputs.audit_reviewed }}
  RESET_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  check:
    name: Validate reset request and production protection
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @timmy/contracts
      - run: node --import tsx infrastructure/reset-benchmark-dataset.ts --check
      - run: npm run typecheck:infrastructure
      - run: npm run test:infrastructure
      - run: npm run test -w @timmy/api -- src/benchmark/demo-seed.test.ts
      - name: Require production reviewers
        if: inputs.environment == 'production'
        run: node infrastructure/production-approval.ts
        env:
          GH_TOKEN: ${{ github.token }}

  reset:
    name: Approve reset and seed selected database
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: ${{ inputs.environment }}
    concurrency:
      group: academy-${{ inputs.environment }}-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @timmy/contracts
      - name: Verify approval, reset benchmark data and seed demo in one import
        run: node --import tsx infrastructure/reset-benchmark-dataset.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
